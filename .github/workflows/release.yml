name: Release Daydreaming
run-name: Release Daydreaming ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 0.0.1
        required: true
        default: 0.0.1
        type: string

permissions:
  contents: read

concurrency:
  group: daydreaming-public-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release input and toolchain
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python3 -c 'import os,re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",os.environ["RELEASE_VERSION"])'
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26
          brew install xcodegen actionlint openssl@3 gitleaks
          echo "DAYDREAMING_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
          actionlint
          gitleaks git . --redact=100 --no-banner
      - name: Test release safety and isolated app
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/release/tests -v
          mkdir "$RUNNER_TEMP/test-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/test-source"
          cd "$RUNNER_TEMP/test-source"
          xcodegen generate
          xcodebuild test -project Daydreaming.xcodeproj -scheme Daydreaming -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/test-build" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            PRODUCT_BUNDLE_IDENTIFIER=be.spatie.daydreaming.preview.tests CODE_SIGNING_ALLOWED=NO

  release:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check all credentials before building
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          DAYDREAMING_SPARKLE_PRIVATE_KEY: ${{ secrets.DAYDREAMING_SPARKLE_PRIVATE_KEY }}
          DAYDREAMING_WEATHERKIT_PROFILE: ${{ secrets.DAYDREAMING_WEATHERKIT_PROFILE }}
          DAYDREAMING_S3_ACCESS_KEY_ID: ${{ secrets.DAYDREAMING_S3_ACCESS_KEY_ID }}
          DAYDREAMING_S3_SECRET_ACCESS_KEY: ${{ secrets.DAYDREAMING_S3_SECRET_ACCESS_KEY }}
          DAYDREAMING_RELEASE_TOKEN: ${{ secrets.DAYDREAMING_RELEASE_TOKEN }}
          DAYDREAMING_S3_ENDPOINT: ${{ vars.DAYDREAMING_S3_ENDPOINT }}
          DAYDREAMING_S3_REGION: ${{ vars.DAYDREAMING_S3_REGION }}
          DAYDREAMING_S3_BUCKET: ${{ vars.DAYDREAMING_S3_BUCKET }}
          DAYDREAMING_S3_PREFIX: ${{ vars.DAYDREAMING_S3_PREFIX }}
          DAYDREAMING_OBJECT_BASE_URL: ${{ vars.DAYDREAMING_OBJECT_BASE_URL }}
        run: python3 scripts/release/ci.py preflight
      - name: Resolve version, build and automatic notes
        id: metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew install xcodegen awscli openssl@3
          echo "DAYDREAMING_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
          version="$RELEASE_VERSION"
          build="$(git rev-list --count HEAD)"
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'This version already has a tag. Use a new version.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/prior-releases.json"
          previous="$(python3 -c 'import json,sys; r=[x for x in json.load(open(sys.argv[1])) if not x["draft"] and not x["prerelease"]]; print(r[0]["tag_name"] if r else "")' "$RUNNER_TEMP/prior-releases.json")"
          notes_args=(--version "$version" --output "$RUNNER_TEMP/release-notes")
          if [ -n "$previous" ]; then notes_args+=(--previous-tag "$previous"); fi
          python3 scripts/release/notes.py "${notes_args[@]}"
          curl --fail --silent --show-error --proto '=https' https://getdaydreaming.com/appcast.xml \
            -o "$RUNNER_TEMP/prior-appcast.xml"
          {
            echo "version=$version"
            echo "build=$build"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Configure temporary signing and notarization keychain
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          DAYDREAMING_SPARKLE_PRIVATE_KEY: ${{ secrets.DAYDREAMING_SPARKLE_PRIVATE_KEY }}
          DAYDREAMING_WEATHERKIT_PROFILE: ${{ secrets.DAYDREAMING_WEATHERKIT_PROFILE }}
        run: python3 scripts/release/ci.py setup
      - name: Build, sign, notarize, staple and verify app and branded DMG
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_BUILD: ${{ steps.metadata.outputs.build }}
        run: |
          python3 scripts/release/prepare.py --version "$RELEASE_VERSION" --build "$RELEASE_BUILD" \
            --identity 'Developer ID Application: Spatie (97KRXCRMAY)' --notary-profile daydreaming-ci \
            --notes "$RUNNER_TEMP/release-notes/notes.html" --generated-notes \
            --sparkle-key-file "$RUNNER_TEMP/daydreaming-sparkle.key" \
            --weatherkit-profile "$RUNNER_TEMP/daydreaming-weatherkit.provisionprofile" \
            --previous-feed "$RUNNER_TEMP/prior-appcast.xml" --output "$RUNNER_TEMP/release-artifacts"
      - name: Keep verified artifacts for recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daydreaming-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.build }}
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable artifacts, register them, then promote signed feed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DAYDREAMING_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DAYDREAMING_S3_SECRET_ACCESS_KEY }}
          DAYDREAMING_RELEASE_TOKEN: ${{ secrets.DAYDREAMING_RELEASE_TOKEN }}
          DAYDREAMING_S3_ENDPOINT: ${{ vars.DAYDREAMING_S3_ENDPOINT }}
          DAYDREAMING_S3_REGION: ${{ vars.DAYDREAMING_S3_REGION }}
          DAYDREAMING_S3_BUCKET: ${{ vars.DAYDREAMING_S3_BUCKET }}
          DAYDREAMING_S3_PREFIX: ${{ vars.DAYDREAMING_S3_PREFIX }}
          DAYDREAMING_OBJECT_BASE_URL: ${{ vars.DAYDREAMING_OBJECT_BASE_URL }}
        run: python3 scripts/release/publish.py "$RUNNER_TEMP/release-artifacts" --sparkle-key-file "$RUNNER_TEMP/daydreaming-sparkle.key"
      - name: Create GitHub release with automatic notes and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release-artifacts/"*.dmg \
            "$RUNNER_TEMP/release-artifacts/"*.zip --target "$GITHUB_SHA" \
            --title "Daydreaming $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes/notes.md"
      - name: Clean up credentials on success, failure or cancellation
        if: always()
        run: python3 scripts/release/ci.py cleanup
