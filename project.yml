name: Daydreaming
options:
  bundleIdPrefix: be.spatie
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    version: 2.13.9
targets:
  Daydreaming:
    type: application
    platform: macOS
    sources:
      - WeatherCanvas
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.spatie.daydreaming
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WeatherCanvas/Info.plist
        CODE_SIGN_ENTITLEMENTS: WeatherCanvas/WeatherCanvas.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  DaydreamingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - WeatherCanvasTests
    dependencies:
      - target: Daydreaming
