name: Daydreaming
options:
  bundleIdPrefix: be.spatie
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DAYDREAMING_DATA_PROTECTION_KEYCHAIN: NO
    DAYDREAMING_SPARKLE_PUBLIC_KEY: "ClbZzJEHvApUetl1Ej1lXqmInXzGjJEwvd2YDrFK2+4="
    MARKETING_VERSION: 0.0.7
    CURRENT_PROJECT_VERSION: 21
    DEVELOPMENT_TEAM: 97KRXCRMAY
    CODE_SIGN_IDENTITY: Developer ID Application
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
  configs:
    Debug:
      DAYDREAMING_BUILD_CHANNEL: local
    Release:
      DAYDREAMING_BUILD_CHANNEL: release
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    version: 2.13.9
targets:
  Daydreaming:
    type: application
    platform: macOS
    sources:
      - WeatherCanvas
    dependencies:
      - package: SwiftSoup
      - package: Sparkle
    postBuildScripts:
      - name: Sign Sparkle helpers
        script: '"${SRCROOT}/scripts/sign-sparkle.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.spatie.daydreaming
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WeatherCanvas/Info.plist
        CODE_SIGN_ENTITLEMENTS: WeatherCanvas/WeatherCanvas.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: Daydreaming
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  DaydreamingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - WeatherCanvasTests
    dependencies:
      - target: Daydreaming
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
